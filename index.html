<!DOCTYPE html>
<html lang="en">

<head>
    <title>MarkupEditor</title>
    <meta charset="UTF-8" />
    <meta name="viewport" charset="utf-8" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <markup-editor 
        placeholder="Edit the document..."
        muscript="node_modules/markupeditor-base/dist/markupeditor.umd.js"
        mustyle="node_modules/markupeditor-base/styles/markupeditor.css"
        userscript="src/setup.js"
        userstyle="styles/desktop.css"
        delegate="MarkupDelegate"
        toolbar="DesktopToolbar"
        behavior="DesktopBehavior"
        keymap="DesktopKeymap"
    ></markup-editor>
    <script src="node_modules/markupeditor-base/webcomponent/markup-editor.js"></script>
</body>

</html>
